<div class="h-full flex flex-col">
  @let isCompact = navStyle() === "compact";
  <section
    class="flex items-center justify-between px-4 py-4"
    [class.justify-center]="isCompact"
  >
    <figure class="h-8" [class.hidden]="isCompact">
      <app-logo [width]="118" [height]="32" />
    </figure>
    <button
      (click)="toggleNavStyle()"
      class="text-surface-500 size-8 flex-center rounded cursor-pointer hover:bg-surface-100 transition-colors duration-300"
      [class.!hidden]="!collapseButton()"
    >
      <i
        class="fas"
        [class]="isCompact ? 'fas fa-angles-right' : 'fas fa-angles-left'"
      ></i>
    </button>
  </section>

  <section class="flex-1 overflow-hidden">
    <app-scroll-container styleClass="h-full">
      <app-navigation [navItems]="navItems()" [navStyle]="navStyle()" />
    </app-scroll-container>
  </section>

  <section class="p-2 border-t border-surface-200">
    <div class="flex items-center justify-end gap-2" [class.!flex-col]="isCompact">
      <button
        class="size-8 flex-center rounded-full bg-surface-100 cursor-pointer"
        (click)="toggleDarkMode()"
        [class]="
          isDarkMode() ? 'bg-white/20 text-white' : 'bg-yellow-500/20 text-yellow-600'
        "
      >
        @let themeIcon =
          isDarkMode() ? "far fa-moon-stars" : "far fa-sun-bright";
        <i [class]="themeIcon"></i>
      </button>
      <button
        class="size-8 flex-center rounded-full cursor-pointer bg-red-500/20 text-red-600 dark:text-red-100"
        (click)="logout()"
      >
        <i class="far fa-power-off"></i>
      </button>
    </div>
  </section>
</div>
