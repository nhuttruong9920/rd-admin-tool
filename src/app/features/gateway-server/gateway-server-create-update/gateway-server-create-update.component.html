<div class="p-2 md:p-4 md:px-16 relative">
  <section class="flex items-center gap-2 mb-2">
    <p-button
      icon="fas fa-arrow-left"
      severity="secondary"
      (click)="backToGatewayServer()"
    />
    <h1 class="font-bold text-xl text-surface-700 truncate">
      {{ isUpdating ? "Cập nhật" : "Tạo" }} Gateway Server
    </h1>
  </section>

  <section class="w-full flex-center">
    <div class="max-w-150 w-full bg-surface rounded-lg shadow-md p-6">
      <form [formGroup]="createForm" (ngSubmit)="onSubmit()">
        <p-floatlabel variant="on" class="mt-1 mb-2">
          <input
            pInputText
            id="id"
            formControlName="id"
            autocomplete="off"
            fluid
            pSize="small"
            [readonly]="isUpdating"
          />
          <label for="id">Id <span class="text-red-500">*</span></label>
        </p-floatlabel>

        <div class="flex flex-col gap-2 mt-2">
          <p-floatlabel variant="on">
            <input
              pInputText
              id="name"
              formControlName="name"
              autocomplete="off"
              fluid
              pSize="small"
            />
            <label for="name">Name <span class="text-red-500">*</span></label>
          </p-floatlabel>

          <p-floatlabel variant="on">
            <input
              pInputText
              id="baseUrl"
              formControlName="baseUrl"
              autocomplete="off"
              fluid
              pSize="small"
            />
            <label for="baseUrl"
              >Base URL <span class="text-red-500">*</span></label
            >
          </p-floatlabel>

          <div class="flex flex-col gap-2 mt-4">
            <h3 class="font-medium text-sm m-0">Metadata</h3>

            @for (
              metadataGroup of metadataFormArray.controls;
              track metadataGroup.value;
              let i = $index
            ) {
              <div class="flex flex-col gap-2">
                <div class="flex gap-2 items-center">
                  <p-floatlabel variant="on" class="flex-1">
                    <input
                      pInputText
                      [id]="'metadata-key-' + i"
                      autocomplete="off"
                      [formControl]="$any(metadataGroup).controls.key"
                      fluid
                      pSize="small"
                    />
                    <label [for]="'metadata-key-' + i">Key {{ i + 1 }}</label>
                  </p-floatlabel>

                  <p-floatlabel variant="on" class="flex-1">
                    <input
                      pInputText
                      [id]="'metadata-value-' + i"
                      autocomplete="off"
                      [formControl]="$any(metadataGroup).controls.value"
                      fluid
                      pSize="small"
                    />
                    <label [for]="'metadata-value-' + i"
                      >Value {{ i + 1 }}</label
                    >
                  </p-floatlabel>

                  <p-button
                    icon="fas fa-trash-alt"
                    size="small"
                    text
                    severity="danger"
                    type="button"
                    (click)="onRemoveMetadataEntry(i)"
                    [ariaLabel]="'Remove metadata entry ' + (i + 1)"
                  />
                </div>
              </div>
            }

            <p-button
              icon="fas fa-plus"
              size="small"
              text
              type="button"
              fluid
              label="Thêm metadata"
              (click)="onAddMetadataEntry()"
            />
          </div>
        </div>

        <div class="flex justify-end gap-2 mb-4 md:mb-0">
          <p-button
            label="Hủy"
            type="button"
            text
            (click)="backToGatewayServer()"
          />

          <p-button [label]="isUpdating ? 'Cập nhật' : 'Tạo'" type="submit" />
        </div>
      </form>
    </div>
  </section>
</div>
