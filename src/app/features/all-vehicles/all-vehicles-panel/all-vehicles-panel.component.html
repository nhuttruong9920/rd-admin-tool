<div class="h-full w-full p-2 flex flex-col gap-2">
  <!-- toolbar -->
  <section>
    <app-toolbar
      headerTitle="Danh sách thiết bị"
      [amount]="deviceStore.count()"
    >
      <ng-template #rightContent>
        <app-input-search
          placeholder="Tìm theo imei"
          (textChanged)="searchImeis($event)"
        ></app-input-search>
      </ng-template>
    </app-toolbar>
  </section>

  <!-- vehicle list -->
  <section class="flex-1 overflow-y-auto">
    <cdk-virtual-scroll-viewport #cdkViewport itemSize="135" class="h-full">
      <div
        *cdkVirtualFor="
          let device of deviceStore.filteredData();
          let idx = index
        "
      >
        <app-vehicle-card
          [id]="idx"
          [device]="device"
          [(selectedVehicleId)]="selectedDeviceId"
        />
      </div>
    </cdk-virtual-scroll-viewport>
  </section>
</div>
