<div class="p-3 md:p-4 flex flex-col gap-4 min-w-96">
  <section class="space-y-2">
    <h3 class="text-sm font-semibold text-surface-700">Thông tin key</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      <div class="space-y-1">
        <div class="text-xs text-surface-600">Code</div>
        <div class="flex items-center gap-2 font-mono">
          <span class="break-all">{{ key().keyCode }}</span>
          <app-copy-button
            [value]="key().keyCode"
            [showLabel]="false"
            size="small"
            variant="text"
          />
        </div>
      </div>

      <div class="space-y-1">
        <div class="text-xs text-surface-600">Trạng thái</div>
        <div>
          <span
            class="rounded px-2 py-1 text-xs font-medium"
            [class]="
              key().formattedStatus.textColor +
              ' ' +
              key().formattedStatus.backgroundColor
            "
          >
            {{ key().formattedStatus.name }}
          </span>
        </div>
      </div>

      <div class="space-y-1">
        <div class="text-xs text-surface-600">User Id</div>
        <div class="truncate">{{ key().assignedToUserId || "-" }}</div>
      </div>

      <div class="space-y-1">
        <div class="text-xs text-surface-600">Hiệu lực</div>
        <div class="flex items-center gap-2">
          <span>
            {{ key().validFrom | toDate }} - {{ key().validUntil | toDate }}
          </span>
          <span class="text-xs text-surface-600"
            >(còn {{ remainingDays }} ngày)</span
          >
        </div>
      </div>

      <div class="space-y-1 md:col-span-2">
        <div class="text-xs text-surface-600">Ngày tạo</div>
        <div>{{ key().generatedAt | toDate }}</div>
      </div>
    </div>
  </section>

  <section class="flex items-center justify-end gap-2">
    <p-button
      label="Đóng"
      severity="secondary"
      (onClick)="closeDialog.emit()"
    />
  </section>
</div>
