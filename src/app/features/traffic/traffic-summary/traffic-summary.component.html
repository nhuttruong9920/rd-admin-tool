<h1 class="text-2xl font-bold text-surface-800 mb-6">Tổng quan</h1>
@if (trafficSummary(); as trafficData) {
  <div class="grid grid-cols-12 gap-6">
    @for (card of summaryCards(); track card.label) {
      <div
        class="bg-surface p-4 rounded-lg shadow col-span-12 sm:col-span-6 lg:col-span-3"
      >
        <div class="flex justify-between">
          <div>
            <p class="text-sm font-medium text-surface-600">
              {{ card.label }}
            </p>
            <p class="text-2xl font-bold">
              <span>{{ card.value }}</span>
              @if (card.unit) {
                <span class="text-sm font-normal ml-0.5">{{ card.unit }}</span>
              }
            </p>
          </div>
          <div
            [class]="card.icon.bgClass"
            class="flex-center size-10 rounded-full"
          >
            <i [class]="card.icon.iconClass" class="text-white text-lg"></i>
          </div>
        </div>
      </div>
    }

    <div class="bg-surface p-4 rounded-lg shadow col-span-12 md:col-span-6">
      <div
        echarts
        [options]="statusCodeChart()"
        [theme]="isDarkMode() ? 'dark' : 'light'"
        class="h-80 w-full"
      ></div>
    </div>

    <div class="bg-surface p-4 rounded-lg shadow col-span-12 md:col-span-6">
      <div
        echarts
        [options]="methodChart()"
        [theme]="isDarkMode() ? 'dark' : 'light'"
        class="h-80 w-full"
      ></div>
    </div>
  </div>
} @else {
  <!-- Loading State -->
  <div class="flex items-center justify-center h-64">
    <div
      class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"
    ></div>
    <span class="ml-3 text-gray-600 dark:text-gray-400"
      >Loading traffic data...</span
    >
  </div>
}
