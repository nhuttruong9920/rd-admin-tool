<div
  class="relative p-2 shadow flex flex-col gap-0.5 border border-surface-300 rounded cursor-pointer mb-1"
  [class]="
    isSelected()
      ? '!border-primary-500 dark:!border-primary-300 border-l-5 pl-1'
      : ''
  "
>
  <div class="flex items-center justify-between gap-1">
    <p class="font-semibold">{{ connection().imei }}</p>
    <div class="flex items-center gap-2">
      <div class="w-18">
        <p-inputnumber
          inputId="integeronly"
          [(ngModel)]="inputChannel"
          showButtons
          [min]="0"
          [max]="7"
          size="small"
          [useGrouping]="false"
          fluid
        />
      </div>
      <p-button
        icon="fas fa-plus"
        rounded
        text
        raised
        size="small"
        (click)="onAddChannel()"
      />
    </div>
  </div>
</div>
