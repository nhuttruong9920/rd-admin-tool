@if (connectionStatus().length > 0) {
  <div class="p-4">
    <div
      class="grid auto-rows-fr grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-4"
    >
      @for (connection of connectionStatus(); track connection.imei) {
        <app-detail-card [connection]="connection" (click)="toVehicleDetail(connection.imei)" />
      }
    </div>
  </div>
} @else {
  <app-data-state state="empty" />
}
